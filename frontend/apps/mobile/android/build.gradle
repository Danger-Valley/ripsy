buildscript {
    ext {
        buildToolsVersion = "37.0.0"
        minSdkVersion = 24
        compileSdkVersion = 37
        targetSdkVersion = 36
        // Rive 11.9.x requires the LLVM 19 C++ runtime shipped with NDK 28.
        ndkVersion = "28.2.13676358"
        kotlinVersion = "2.2.0"
        // Seeker Connect's compileOnly API must match the host, not its SDK default.
        reactNativeVersion = new groovy.json.JsonSlurper().parse(file("../package.json")).dependencies["react-native"]
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.4")
    }
}

apply plugin: "com.facebook.react.rootproject"
